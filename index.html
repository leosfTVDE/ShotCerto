<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ShotCerto</title>
<meta name="description" content="Fotos que vendem, feitas com o seu celular.">
<meta name="theme-color" content="#FAF7F2">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ShotCerto">
<style>
:root{
  --coral:#FF5E3A;--pink:#FF3D7F;--gold:#F5B700;--ink:#1C1C24;--soft:#76747F;--line:#ECE7DF;
  --bg:#FAF7F2;--card:#FFFFFF;--green:#1FA56A;--greenbg:#E6F6EE;--coralbg:#FFEDE7;--dark:#1E1E28;
  --r:22px;--shadow:0 6px 20px rgba(28,28,36,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
body.semtabs{padding-bottom:24px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 24px}
h1{font-size:30px;line-height:1.15;margin:6px 0 4px;letter-spacing:-.5px}
h2{font-size:21px;margin:26px 0 12px;letter-spacing:-.3px}
h3{font-size:17px;margin:0 0 4px}
p{margin:0 0 10px}
.sub{color:var(--soft);margin:0 0 16px}
.small{font-size:13.5px;color:var(--soft)}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:9px}
.mini-ico{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--coral),var(--pink));display:grid;place-items:center;position:relative;box-shadow:0 3px 10px rgba(255,94,58,.35)}
.mini-ico::before{content:"";width:15px;height:15px;border-radius:50%;border:3.5px solid #fff}
.mini-ico::after{content:"✦";position:absolute;top:3px;right:5px;color:var(--gold);font-size:9px}
.logo{display:flex;align-items:center;font-weight:800;font-size:23px;color:var(--coral);letter-spacing:-.6px}
.logo .lens{width:.6em;height:.6em;border:.15em solid var(--coral);border-radius:50%;margin:0 .03em;position:relative;top:.06em}
.logo .lens::after{content:"✦";position:absolute;top:-.62em;right:-.52em;color:var(--gold);font-size:.5em}
.logo .light{font-weight:700;opacity:.92}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--coralbg);color:var(--coral);display:grid;place-items:center;font-weight:800}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--soft);font-weight:600;padding:6px 0;margin-bottom:4px}

/* cartões */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--coral),#FF7A4D 60%,var(--pink));color:#fff;border-radius:26px;padding:20px;margin:8px 0 14px;box-shadow:0 10px 26px rgba(255,94,58,.3)}
.hero .tag{opacity:.9;font-size:14px;font-weight:600}
.hero h2{margin:4px 0 14px;font-size:24px;color:#fff}
.hero .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hbtn{background:#fff;color:var(--coral);border-radius:16px;padding:13px 10px;font-weight:700;font-size:15px;line-height:1.2}
.hbtn.ghost{background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.dark{background:var(--dark);color:#fff}
.dark .small{color:#B9B8C4}

.btn{display:block;width:100%;background:var(--coral);color:#fff;border-radius:18px;padding:15px;font-weight:700;font-size:16.5px;text-align:center;box-shadow:0 6px 16px rgba(255,94,58,.28)}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.btn.darkb{background:var(--ink);box-shadow:none}
.btn:disabled{opacity:.5}
.btn+.btn{margin-top:10px}
.link{color:var(--coral);font-weight:700}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sit{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:left;position:relative;min-height:96px}
.sit .em{font-size:28px;display:block;margin-bottom:6px}
.sit b{display:block;font-size:15px;line-height:1.25}
.sit .small{display:block;margin-top:2px;font-size:12.5px}
.lock{position:absolute;top:10px;right:12px;font-size:14px;opacity:.75}

.lesson{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:left}
.lesson .num{width:46px;height:46px;border-radius:14px;background:var(--coralbg);color:var(--coral);display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
.lesson .num.done{background:var(--greenbg);color:var(--green)}
.lesson b{display:block;font-size:15.5px;line-height:1.25}

.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--coralbg);color:var(--coral)}
.pill.g{background:var(--greenbg);color:var(--green)}
.pill.d{background:#EEE;color:#555}

.bar{height:9px;border-radius:9px;background:#EEEAE3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--coral)}
.bar i.g{background:var(--green)}

.step{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto;font-size:14px}
.tip{border-left:5px solid var(--coral);border-radius:16px;background:var(--card);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.tip.g{border-left-color:var(--green)}
.device{background:var(--coralbg);border-radius:16px;padding:12px 14px;margin:6px 0 12px;font-size:15px}
.device b{color:var(--coral)}

.photo{position:relative;border-radius:24px;overflow:hidden;background:#EDE6DA;margin:6px 0 14px}
.photo img{display:block;width:100%;max-height:440px;object-fit:cover}
.score{position:absolute;top:12px;right:12px;width:82px;height:82px;border-radius:50%;background:#fff;border:6px solid var(--coral);display:grid;place-items:center;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.score b{font-size:25px;line-height:1}
.score span{font-size:11px;color:var(--soft);display:block}
.score.g{border-color:var(--green)}

.metric{display:grid;grid-template-columns:92px 1fr 34px;align-items:center;gap:10px;margin:8px 0;font-weight:600;font-size:14.5px}
.metric span:last-child{text-align:right;color:var(--soft);font-size:13px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#EFEAE2;border-radius:16px;padding:4px;margin-bottom:10px}
.seg button{border-radius:12px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--soft)}
.seg button.on{background:var(--ink);color:#fff}
.caption{white-space:pre-wrap;background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);font-size:15.5px;margin-bottom:10px}
.caption .hash{color:var(--coral)}

.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.opt.on{border-color:var(--coral);background:#FFF8F5}
.opt .em{font-size:26px}
.opt .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:13px}
.opt.on .ck{background:var(--coral);border-color:var(--coral)}

.field{margin-bottom:12px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input,.field select{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px;outline:none}
.field input:focus,.field select:focus{border-color:var(--coral)}

.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.dots i{width:8px;height:8px;border-radius:8px;background:var(--line)}
.dots i.on{width:22px;background:var(--coral)}

.plan{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;position:relative}
.plan.best{border-color:var(--coral)}
.plan .badge{position:absolute;top:-11px;right:16px;background:var(--coral);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
.plan .price{font-size:26px;font-weight:800;letter-spacing:-.5px}
.plan ul{margin:8px 0 12px;padding:0;list-style:none}
.plan li{padding:3px 0 3px 24px;position:relative;font-size:14.5px}
.plan li::before{content:"✓";position:absolute;left:2px;color:var(--green);font-weight:800}

.lesson-body li{margin-bottom:8px}
.challenge{background:var(--dark);color:#fff;border-radius:20px;padding:16px;margin:14px 0}
.challenge .pill{background:rgba(255,255,255,.15);color:#fff}

.hist{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.hist img{width:56px;height:56px;border-radius:14px;object-fit:cover;background:#eee}

.banner{background:#FFF4D6;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14.5px}
.demo{background:#EAF2FF;color:#2754A0;border-radius:14px;padding:8px 12px;font-size:13px;margin-bottom:12px}

/* abas */
#tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
#tabs.hide{display:none}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--soft);min-width:58px}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--coral)}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.loading{display:grid;place-items:center;min-height:60vh;text-align:center}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--coralbg);border-top-color:var(--coral);animation:sp 1s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.version{color:#B5B2AA;font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><div class="spin"></div><p class="small">Carregando…</p></div></div></div>
<nav id="tabs" class="hide"></nav>
<div id="toast"></div>
<input id="filePick" type="file" accept="image/*" hidden>
<input id="fileCam" type="file" accept="image/*" capture="environment" hidden>

<script src="config.js"></script>
<script>

  if(conteudoCompleto()) return true;
  const a=aula(id); return !(a&&a.premium);
}

  const e=(S.user&&S.user.email||"").toLowerCase().trim();

function usosRestantes(){
  const a=S.acesso||{};

let _fotoCb=null;
function tirarFoto(sitId,camera){
  if(sitId) S.p.ultimaSit=sitId;
  const inp=camera?$("#fileCam"):$("#filePick");
  inp.value="";
  _fotoCb=async(file)=>{
    try{
      const img=await lerImagem(file,1280);
      const tom=S.p.tom;
      go("analisar",{sit:sitId||S.p.sit,img,tom});
    }catch(e){toast("Não consegui abrir essa foto. Tente outra.");}
  };
  inp.click();
}
["#filePick","#fileCam"].forEach(id=>$(id).addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f&&_fotoCb)_fotoCb(f);}));

function lerImagem(file,max){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.85));};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};
    img.src=url;
  });
}
function miniatura(dataUrl,max=320){
  return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7));};img.onerror=()=>res("");img.src=dataUrl;});
}

async function analisar(){
  if(usosRestantes()<=0){go("planos");return;}
  const sid=S.p.sit, img=S.p.img, tom=S.p.tom||"simpatico";
  go("analisando");
  try{
    const corpo={imagem:img.split(",")[1],situacao:sit(sid).nome,objetivo:(S.perfil&&S.perfil.objetivo)||"vender",celular:cel(),tom,nome:(S.perfil&&S.perfil.nome)||""};
    const res=IA_SIMULADA?await iaDemo(corpo,sid):await api("/analisar",corpo);
    const thumb=await miniatura(img);
    const item={sit:sid,res,thumb,data:Date.now(),tom};
    await guardarHist(item);
    await atualizarAcesso();
    S.view="resultado";S.p={res,img,thumb,sit:sid,tom,plat:"instagram"};render();window.scrollTo(0,0);
  }catch(e){
    go("analisar",{sit:sid,img,tom});
    if(e.codigo==="sem_creditos"){toast("Suas análises acabaram");go("planos");}
    else if(e.codigo==="verificar"){toast("Confirme o seu email primeiro");}

  }
}

    render();toast("Nova versão pronta!");

    if(e.codigo==="sem_creditos"){go("planos");}
    toast(e.message||"Não foi possível agora.");
    if(b){b.disabled=false;b.textContent="Outra versão";}
  }
}
function abrirHist(i){const h=S.hist[i];S.view="resultado";S.p={res:h.res,thumb:h.thumb,sit:h.sit,tom:h.tom||"simpatico",plat:"instagram",deHist:true};render();window.scrollTo(0,0);}

function comprar(plano){
  if(!DEMO&&S.user&&!S.user.emailVerified){toast("Confirme o seu email antes de pagar");return;}
  const link=(C.checkout||{})[plano];
  if(!link){toast(DEMO?"Modo demonstração: use \"Simular plano\" no Perfil.":"Link de pagamento ainda não configurado.");return;}
  const email=S.user&&S.user.email?encodeURIComponent(S.user.email):"";
  const url=link+(email?(link.includes("?")?"&":"?")+"email="+email:"");
  window.open(url,"_blank","noopener");
}

// ===== Dados (Firebase ou demonstração) =====
async function salvarPerfil(){
  if(DEMO){lsSet("sc_perfil",S.perfil);return;}
  await db.collection("users").doc(S.user.uid).set(S.perfil,{merge:true});
}
async function guardarHist(item){
  S.hist.unshift(item); S.hist=S.hist.slice(0,30);
  if(DEMO){lsSet("sc_hist",S.hist.slice(0,15));return;}
  try{await db.collection("users").doc(S.user.uid).collection("analises").add(item);}catch(e){console.warn(e);}
}
async function carregarHist(){
  if(DEMO){S.hist=lsGet("sc_hist",[]);return;}
  try{const q=await db.collection("users").doc(S.user.uid).collection("analises").orderBy("data","desc").limit(30).get();S.hist=q.docs.map(d=>d.data());}catch(e){S.hist=[];}
}
async function atualizarAcesso(manual){
  try{
    if(DEMO||IA_SIMULADA){S.acesso=acessoDemo();}
    else{
      if(manual&&auth.currentUser){await auth.currentUser.reload();S.user=auth.currentUser;await auth.currentUser.getIdToken(true);}
      S.acesso=await api("/me");
    }
    if(manual){toast(S.acesso.plano?"Plano ativo! ✅":"Ainda não encontramos um plano para este email");render();}
  }catch(e){if(manual)toast(e.message||"Não foi possível atualizar");}
}
async function api(path,body){
  const token=await auth.currentUser.getIdToken();
  const r=await fetch(C.workerUrl.replace(/\/$/,"")+path,{method:body?"POST":"GET",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.erro||"Erro de ligação");e.codigo=j.codigo;throw e;}
  return j;
}

// ===== Modo demonstração =====
function acessoDemo(){
  if(eAdminLocal()) return {plano:"admin",admin:true,conteudoCompleto:true,iaLimite:999,iaUsadas:0,iaRestante:999,testeRestante:REGRAS.testeAnalises,verificado:true};
  const plano=lsGet("sc_demo_plano","")||null;
  const usos=lsGet("sc_demo_usos",{});
  const mes=new Date().toISOString().slice(0,7);
  const lim=plano?REGRAS[plano]:0;
  const usadas=usos[mes]||0, teste=usos.teste||0;
  return {plano,conteudoCompleto:!!plano,iaLimite:lim,iaUsadas:usadas,iaRestante:Math.max(0,lim-usadas),testeRestante:Math.max(0,REGRAS.testeAnalises-teste),assinaturaAte:plano&&plano!=="vitalicio"?Date.now()+(plano==="anual"?365:30)*864e5:null,iaAte:plano==="vitalicio"?Date.now()+365*864e5:null,verificado:true,admin:false};
}
function gastarDemo(){
  if(eAdminLocal()) return;
  const a=acessoDemo(), usos=lsGet("sc_demo_usos",{}), mes=new Date().toISOString().slice(0,7);
  if(a.iaLimite>0&&a.iaRestante>0) usos[mes]=(usos[mes]||0)+1;
  else if(a.testeRestante>0) usos.teste=(usos.teste||0)+1;
  else {const e=new Error("Suas análises acabaram");e.codigo="sem_creditos";throw e;}
  lsSet("sc_demo_usos",usos);
}
function demoPlano(v){lsSet("sc_demo_plano",v);S.acesso=acessoDemo();render();toast(v?"Plano simulado: "+v:"Voltou ao grátis");}
const espera=ms=>new Promise(r=>setTimeout(r,ms));
function legendasModelo(s,tom,obj,v){
  const vender=obj!=="pessoal";
  const base={
    produto:["Feito para durar e para encantar.","Detalhes que fazem a diferença no seu dia."],
    roupa:["A peça que faltava no seu guarda-roupa.","Conforto e estilo na mesma peça."],
    comida:["Feito hoje, com carinho, para adoçar o seu dia.","Fresquinho e do jeitinho que você gosta."],
    beleza:["Seu ritual de cuidado merece esse carinho.","Textura leve, resultado que aparece."],
    acessorios:["O detalhe que transforma o look.","Brilho na medida certa."],
    artesanato:["Feito à mão, peça por peça. Nenhuma é igual.","Para deixar a sua casa com a sua cara."],
    cafe:["Café, luz da manhã e calma. Bom dia!","Começando o dia do jeito certo."],
    selfie:["Hoje é dia de sorrir para a câmera.","Leve, simples e feliz."],
    look:["Look do dia aprovado.","Vestindo o que me faz bem."],
    viagem:["Guardando esse lugar no coração.","Lugares que ficam na memória."],
    restaurante:["Hoje a comida falou mais alto.","Cada garfada valeu a pena."],
    pet:["O dono(a) da casa, oficialmente.","Amor de quatro patas."]
  }[s.id]||["Uma foto que diz tudo."];
  const frase=base[v%base.length];
  const cta=vender?{simpatico:"Chama no direct que eu te explico tudinho! 💬",profissional:"Pedidos e informações pelo direct ou WhatsApp.",urgente:"Últimas unidades! Garanta a sua agora no direct. ⏳"}[tom]:{simpatico:"E aí, o que acharam? 💛",profissional:"",urgente:"Corre que esse momento já passou! 😄"}[tom];
  return {
    legendas:{
      instagram:`${frase}\n\n${vender?"✨ Qualidade que dá para ver na foto\n📦 Pronta entrega\n":""}${cta}`.trim(),
      whatsapp:vender?`${frase} Valor: [seu preço]. ${tom==="urgente"?"Poucas unidades!":"Quer que eu separe para você?"}`:`${frase}`,
      stories:vender?`${frase.split(".")[0]} ✨\nResponda este story para comprar 👇`:`${frase.split(".")[0]} ✨`
    },
    hashtags:vender?["#"+s.id,"#lojaonline","#feitoamao","#compreempequenosnegocios"]:["#"+s.id,"#momentos","#fotodecelular"]
  };
}
async function iaDemo(corpo,sid){
  await espera(1600); gastarDemo();
  const s=sit(sid), r=Math.random();
  const nota=Math.round((6+r*3)*10)/10;
  const v=()=>Math.round(55+Math.random()*40);
  const dicas=[{tipo:"melhorar",titulo:s.passos[1][0]+": dá para melhorar",texto:s.passos[1][1]},{tipo:"melhorar",titulo:s.passos[2][0],texto:s.passos[2][1]},{tipo:"bom",titulo:"Ponto forte",texto:"A foto tem boa nitidez. Mantenha o celular firme assim."}];
  return Object.assign({nota,resumo:"(Simulação) Boa base! Com dois ajustes simples, esta foto fica pronta para postar.",descricao:s.nome,barras:{luz:v(),fundo:v(),angulo:v(),nitidez:v(),composicao:v()},dicas,dica_celular:corpo.celular==="android"?s.android:s.iphone},legendasModelo(s,corpo.tom,corpo.objetivo,0));
}
async function legendaDemo(corpo,sid){await espera(900);gastarDemo();return legendasModelo(sit(sid),corpo.tom,corpo.objetivo,1+Math.floor(Math.random()*3));}

// ===== Conta =====
async function fazerAuth(criar){
  const email=($("#fEmail").value||"").trim(), senha=$("#fSenha").value||"", nome=criar?($("#fNome").value||"").trim():"";
  if(criar&&!nome){toast("Escreva o seu nome");return;}
  if(!email||!senha){toast("Preencha email e senha");return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast("Esse email não parece certo. Confira.");return;}
  const b=$("#bAuth");b.disabled=true;
  if(DEMO){S.user={uid:"demo",email,emailVerified:true};lsSet("sc_user",S.user);S.perfil=lsGet("sc_perfil",null)||{nome};await iniciarSessao();return;}
  try{
    if(criar){
      S._nomeNovo=nome;
      const cr=await auth.createUserWithEmailAndPassword(email,senha);
      try{await cr.user.sendEmailVerification();}catch(e){}
    }else await auth.signInWithEmailAndPassword(email,senha);
  }catch(e){b.disabled=false;toast(erroAuth(e));}
}
function erroAuth(e){
  const c=e&&e.code||"";
  return ({"auth/email-already-in-use":"Este email já tem conta. Toque em Entrar.","auth/invalid-email":"Email inválido.","auth/weak-password":"A senha precisa de pelo menos 6 caracteres.","auth/invalid-credential":"Email ou senha incorretos.","auth/wrong-password":"Email ou senha incorretos.","auth/user-not-found":"Não existe conta com este email.","auth/too-many-requests":"Muitas tentativas. Espere um pouco."})[c]||"Não foi possível. Tente de novo.";
}
async function esqueciSenha(){
  const email=($("#fEmail").value||"").trim();
  if(!email){toast("Escreva o seu email primeiro");return;}
  if(DEMO){toast("Modo demonstração: não há senha.");return;}
  try{await auth.sendPasswordResetEmail(email);toast("Enviámos um email para criar nova senha");}catch(e){toast(erroAuth(e));}
}
async function reenviarVerif(){try{await auth.currentUser.sendEmailVerification();toast("Email enviado! Veja também o spam.");}catch(e){toast("Espere um pouco e tente de novo");}}
async function sair(){
  if(DEMO){["sc_user","sc_perfil","sc_hist","sc_demo_plano","sc_demo_usos"].forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});S={user:null,perfil:null,acesso:null,hist:[],view:"auth",p:{}};render();return;}
  await auth.signOut();
}
async function iniciarSessao(){
  if(!DEMO){
    try{const d=await db.collection("users").doc(S.user.uid).get();S.perfil=d.exists?d.data():(S.perfil||{nome:S._nomeNovo||""});}catch(e){S.perfil=S.perfil||{};}
  }
  await Promise.all([carregarHist(),atualizarAcesso()]);
  if(!S.perfil||!S.perfil.objetivo||!S.perfil.celular){S.view="onboarding";S.p={passo:S.perfil&&S.perfil.nome?2:1,dados:{nome:(S.perfil&&S.perfil.nome)||"",objetivo:"",celular:""}};render();return;}
  go("home");
}
function carregarScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

async function iniciar(){
  if(DEMO){
    S.user=lsGet("sc_user",null);
    if(S.user){S.perfil=lsGet("sc_perfil",null);await iniciarSessao();}else go("auth",{modo:"criar"});
    return;
  }
  const FB="https://www.gstatic.com/firebasejs/10.12.2/";
  try{
    await carregarScript(FB+"firebase-app-compat.js");
    await Promise.all([carregarScript(FB+"firebase-auth-compat.js"),carregarScript(FB+"firebase-firestore-compat.js")]);
  }catch(e){$("#app").innerHTML=`<div class="loading"><div><h2>Sem ligação à internet</h2><p class="small">Verifique a ligação e abra o app de novo.</p></div></div>`;return;}
  firebase.initializeApp(C.firebase);
  auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(async u=>{
    if(!u){const nn=S._nomeNovo;S={user:null,perfil:null,acesso:null,hist:[],view:"auth",p:{modo:"criar"},_nomeNovo:nn};render();return;}
    S.user=u;S.perfil=null;go("loading");await iniciarSessao();
  });
}

if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
iniciar();
</script>
